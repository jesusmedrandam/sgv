name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A72F25: ${{ secrets.A72F25 }}
          B89F40: ${{ secrets.B89F40 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A72F25', '')
          env_b = os.environ.get('B89F40', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- f6a023299eed7fe20faee9b7964da7587711f613b571b5 -->', env_a)
          if env_b:
              result = result.replace('<!-- f9b6c30df08b6804 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
